name: Flockerwhisper
options:
  bundleIdPrefix: com.flockerwhisper
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 1.1.1

targets:
  Flockerwhisper:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/FlockerwhisperCore
      - path: Sources/Flockerwhisper
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: Flockerwhisper
        PRODUCT_BUNDLE_IDENTIFIER: com.flockerwhisper.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
